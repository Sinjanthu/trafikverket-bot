name: poll-trafikverket

on:
  # GitHub's own `schedule:` trigger used to be here (*/5 * * * *) but is
  # documented as best-effort and was observed in practice skipping runs for
  # 2-4.5 hours at a stretch under load - useless for a slot bot where being
  # even an hour late means someone else already took it. workflow_dispatch
  # (the manual "Run workflow" button) is now driven by an external, actually
  # reliable timer instead - see the "Running via GitHub Actions" section of
  # README.md for the cron-job.org setup (same fix fleet-scraper uses).
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

# Cheap insurance: a run takes ~20-30s, comfortably under the 2-min interval
# in use, but this queues instead of running in parallel if that ever
# changes (a faster timer, a slower run) - same fix applied to
# RydeuOrderPicker after finding it actually needed it there.
concurrency:
  group: poll-trafikverket
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write config.json and payload.json from secrets
        run: |
          echo "$CONFIG_JSON" > config.json
          echo "$PAYLOAD_JSON" > payload.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          PAYLOAD_JSON: ${{ secrets.PAYLOAD_JSON }}

      - name: Restore state.json from cache
        # actions/cache@v4 (the combined restore+save action) was used here
        # before - its post-step auto-saves under its own `key:` whenever
        # there wasn't already an exact hit, which on the very first-ever
        # run created a permanent cache literally named "trafikverket-state".
        # Every run after that got an exact hit on that one frozen cache
        # forever, completely ignoring the real per-run caches the explicit
        # save step below was creating - so the bot silently treated every
        # single run as "first run" from day one, never actually detecting
        # new slots. actions/cache/restore@v4 only restores, never auto
        # -saves, so this can't happen again.
        uses: actions/cache/restore@v4
        with:
          # cookie-warning-state.json travels alongside state.json so the
          # "only warn once per expiry" throttling (not just the "only
          # notify once per slot" logic) also persists across cloud runs.
          path: |
            state.json
            cookie-warning-state.json
          key: trafikverket-state
          # Prefix match against the unique per-run keys the save step
          # below creates - this is what actually finds the latest state.
          restore-keys: trafikverket-state-

      - run: npm install --omit=dev
      - run: node src/index.js

      - name: Save state.json to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            cookie-warning-state.json
          key: trafikverket-state-${{ github.run_id }}
